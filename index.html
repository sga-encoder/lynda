<script>
/* =====================================================================
   DATOS: páginas, lecciones, ejemplos y ejercicios
   Todas las respuestas fueron verificadas derivando el resultado.
   Referencia principal: J. Stewart, "Cálculo de una variable:
   Trascendentes tempranas" (7.ª / 8.ª ed., Cengage).
   ===================================================================== */
const R = String.raw;

/* ---------- Bases matemáticas (página alterna) ---------- */
const BASES = [
 {id:'potencias', t:'Potencias, raíces y exponentes', html:R`
  <p><b>Lo más básico.</b> Una potencia \(x^n\) es multiplicar \(x\) por sí mismo \(n\) veces. Las raíces son potencias con exponente fraccionario: \(\sqrt{x}=x^{1/2}\), \(\sqrt[3]{x}=x^{1/3}\). Para integrar casi siempre hay que <b>reescribir todo como potencias de \(x\)</b>.</p>
  <div class="my-3 overflow-x-auto"><table><tr><th>Regla</th><th>Ejemplo</th></tr>
  <tr><td>\(x^a\cdot x^b=x^{a+b}\)</td><td>\(x^2\cdot x^{1/2}=x^{5/2}\)</td></tr>
  <tr><td>\(\dfrac{x^a}{x^b}=x^{a-b}\)</td><td>\(\dfrac{x^3}{x^2}=x\)</td></tr>
  <tr><td>\((x^a)^b=x^{ab}\)</td><td>\((x^2)^2=x^4\)</td></tr>
  <tr><td>\(x^{-n}=\dfrac1{x^n}\)</td><td>\(\dfrac{1}{x^2}=x^{-2}\)</td></tr>
  <tr><td>\(\sqrt[n]{x^m}=x^{m/n}\)</td><td>\(\dfrac{1}{\sqrt t}=t^{-1/2},\ t\sqrt t=t^{3/2}\)</td></tr></table></div>
  <p><b>Ejemplo medio.</b> Simplificar \(\dfrac{2t^2+t^2\sqrt t-1}{t^2}\). Se divide cada término entre \(t^2\): \(2+t^{1/2}-t^{-2}\).</p>
  <p><b>Ejemplo difícil.</b> \(\dfrac{\ln t}{\sqrt t}\) se escribe \(t^{-1/2}\ln t\); y \(9^{3/2}=(\sqrt9)^3=27\).</p>`},
 {id:'factorizacion', t:'Factorización de polinomios', html:R`
  <p><b>Lo más básico.</b> Factorizar es escribir un polinomio como producto. Para un trinomio \(x^2+bx+c\) se buscan dos números que <b>sumen \(b\)</b> y <b>multipliquen \(c\)</b>.</p>
  <p><b>Ejemplo básico.</b> \(x^2+3x-4\): dos números que sumen \(3\) y multipliquen \(-4\) son \(4\) y \(-1\). Así \(x^2+3x-4=(x+4)(x-1)\).</p>
  <p><b>Ejemplo medio (factor común).</b> \(2x^3+3x^2-2x=x(2x^2+3x-2)=x(2x-1)(x+2)\).</p>
  <p><b>Ejemplo difícil (agrupación).</b> \(x^3-x^2-x+1=x^2(x-1)-(x-1)=(x-1)(x^2-1)=(x-1)^2(x+1)\).</p>
  <p><b>Productos notables:</b> \(a^2-b^2=(a-b)(a+b)\), \((a\pm b)^2=a^2\pm2ab+b^2\). Un cuadrático \(ax^2+bx+c\) es <b>irreducible</b> si \(b^2-4ac<0\) (ej. \(x^2+4\)).</p>`},
 {id:'division', t:'División de polinomios', html:R`
  <p><b>Lo más básico.</b> Si el grado del numerador es mayor o igual al del denominador (fracción <b>impropia</b>), se divide primero: \(\dfrac{P}{Q}=\text{cociente}+\dfrac{\text{residuo}}{Q}\).</p>
  <p><b>Ejemplo.</b> \(\dfrac{x^3+x}{x-1}\). Dividiendo: \(x^3+x=(x-1)(x^2+x+2)+2\), por tanto \(\dfrac{x^3+x}{x-1}=x^2+x+2+\dfrac{2}{x-1}\).</p>
  <p><b>Cómo comprobar:</b> multiplica cociente por divisor y suma el residuo; debe salir el numerador original.</p>`},
 {id:'completar', t:'Completar el cuadrado', html:R`
  <p><b>Lo más básico.</b> \(x^2+bx=\left(x+\tfrac b2\right)^2-\left(\tfrac b2\right)^2\). Sirve para llevar expresiones a la forma \(u^2+a^2\) o \(a^2-u^2\).</p>
  <p><b>Ejemplo.</b> \(x^2+6x+13=(x+3)^2-9+13=(x+3)^2+4\). Con \(u=x+3\): \(\int\frac{dx}{x^2+6x+13}=\int\frac{du}{u^2+4}=\tfrac12\arctan\tfrac{x+3}{2}+C\).</p>`},
 {id:'logs', t:'Logaritmos y exponenciales', html:R`
  <p><b>Lo más básico.</b> \(\ln x\) es la inversa de \(e^x\): \(\ln(e^x)=x\), \(e^{\ln x}=x\), \(\ln1=0\), \(\ln e=1\).</p>
  <div class="my-3 overflow-x-auto"><table><tr><th>Propiedad</th><th>Uso típico</th></tr>
  <tr><td>\(\ln(ab)=\ln a+\ln b\)</td><td>juntar logaritmos</td></tr>
  <tr><td>\(\ln\frac ab=\ln a-\ln b\)</td><td>\(\ln|x-1|-\ln|x+1|=\ln\left|\frac{x-1}{x+1}\right|\)</td></tr>
  <tr><td>\(\ln a^r=r\ln a\)</td><td>\(-\ln|\cos x|=\ln|\sec x|\)</td></tr></table></div>
  <p><b>Límites clave:</b> \(\displaystyle\lim_{t\to\infty}\ln t=\infty\), \(\displaystyle\lim_{t\to\infty}e^{-t}=0\), \(\displaystyle\lim_{t\to-\infty}e^{t}=0\).</p>`},
 {id:'trig', t:'Identidades trigonométricas', html:R`
  <p><b>Lo más básico.</b> En el círculo unitario \(\cos\theta\) es la coordenada \(x\) y \(\sin\theta\) la \(y\), por eso <b>\(\sin^2\theta+\cos^2\theta=1\)</b> (Pitágoras).</p>
  <div class="my-3 overflow-x-auto"><table><tr><th>Identidad</th><th>Para qué sirve</th></tr>
  <tr><td>\(\sin^2\theta+\cos^2\theta=1\)</td><td>convertir \(\sin^2\leftrightarrow\cos^2\); simplificar \(\sqrt{a^2-a^2\sin^2\theta}\)</td></tr>
  <tr><td>\(1+\tan^2\theta=\sec^2\theta\)</td><td>simplificar \(\sqrt{a^2+a^2\tan^2\theta}\); potencias de tan/sec</td></tr>
  <tr><td>\(1+\cot^2\theta=\csc^2\theta\)</td><td>integrar \(\cot^2\theta\)</td></tr>
  <tr><td>\(\sin^2\theta=\tfrac12(1-\cos2\theta)\)</td><td>potencias <b>pares</b> de seno (ángulo medio)</td></tr>
  <tr><td>\(\cos^2\theta=\tfrac12(1+\cos2\theta)\)</td><td>potencias <b>pares</b> de coseno</td></tr>
  <tr><td>\(\sin2\theta=2\sin\theta\cos\theta\)</td><td>regresar a la variable original</td></tr></table></div>
  <p><b>Valores clave:</b> \(\sin0=0,\ \cos0=1,\ \sin\frac\pi2=1,\ \cos\frac\pi2=0,\ \tan\frac\pi4=1,\ \sin\pi=0\).</p>
  <p><b>Ejemplo difícil.</b> \(\cos^5\theta=(\cos^2\theta)^2\cos\theta=(1-\sin^2\theta)^2\cos\theta\).</p>`},
 {id:'triangulo', t:'Triángulo de referencia (volver a x)', html:R`
  <p><b>Lo más básico.</b> SOH-CAH-TOA: \(\sin\theta=\frac{\text{op}}{\text{hip}}\), \(\cos\theta=\frac{\text{ady}}{\text{hip}}\), \(\tan\theta=\frac{\text{op}}{\text{ady}}\).</p>
  <p><b>Cómo se usa.</b> Si hiciste \(x=3\sin\theta\), entonces \(\sin\theta=\frac{x}{3}\): dibuja un triángulo con opuesto \(x\), hipotenusa \(3\). Por Pitágoras el adyacente es \(\sqrt{9-x^2}\). Ahora puedes leer cualquier razón: \(\cot\theta=\frac{\sqrt{9-x^2}}{x}\), \(\cos\theta=\frac{\sqrt{9-x^2}}{3}\).</p>
  <svg viewBox="0 0 260 130" width="260" style="max-width:100%" role="img" aria-label="Triángulo rectángulo">
   <polygon points="20,110 220,110 220,20" fill="none" stroke="currentColor" stroke-width="2"/>
   <rect x="208" y="98" width="12" height="12" fill="none" stroke="currentColor"/>
   <text x="228" y="70" font-size="14" fill="currentColor">x</text>
   <text x="90" y="126" font-size="14" fill="currentColor">√(9 − x²)</text>
   <text x="100" y="55" font-size="14" fill="currentColor">3</text>
   <text x="38" y="106" font-size="14" fill="currentColor">θ</text>
  </svg>`},
 {id:'derivadas', t:'Derivadas y regla de la cadena', html:R`
  <p><b>Lo más básico.</b> Integrar es el proceso <b>inverso</b> de derivar. Si no conoces las derivadas, no podrás reconocer integrales.</p>
  <div class="my-3 overflow-x-auto"><table><tr><th>\(f(x)\)</th><th>\(f'(x)\)</th><th>\(f(x)\)</th><th>\(f'(x)\)</th></tr>
  <tr><td>\(x^n\)</td><td>\(nx^{n-1}\)</td><td>\(\ln x\)</td><td>\(1/x\)</td></tr>
  <tr><td>\(e^x\)</td><td>\(e^x\)</td><td>\(\sin x\)</td><td>\(\cos x\)</td></tr>
  <tr><td>\(\cos x\)</td><td>\(-\sin x\)</td><td>\(\tan x\)</td><td>\(\sec^2x\)</td></tr>
  <tr><td>\(\sec x\)</td><td>\(\sec x\tan x\)</td><td>\(\arcsin x\)</td><td>\(\frac{1}{\sqrt{1-x^2}}\)</td></tr>
  <tr><td>\(\arctan x\)</td><td>\(\frac{1}{1+x^2}\)</td><td>\(\cot x\)</td><td>\(-\csc^2x\)</td></tr></table></div>
  <p><b>Regla del producto:</b> \((uv)'=u'v+uv'\) &rarr; origen de la <a href="#/l3">integración por partes</a>.</p>
  <p><b>Regla de la cadena:</b> \(\big(f(g(x))\big)'=f'(g(x))\,g'(x)\) &rarr; origen de la <a href="#/l2">sustitución</a>.</p>
  <p><b>Ejemplo medio.</b> \(\frac{d}{dx}\sin(x^4+2)=\cos(x^4+2)\cdot4x^3\).</p>
  <p><b>Ejemplo difícil.</b> \(\frac{d}{dx}\big[x\,f(x)\big]=f(x)+x f'(x)\) (producto). Es la clave del ejercicio 6 del examen.</p>`},
 {id:'tabla', t:'Tabla de integrales básicas', html:R`
  <p><b>Lo más básico.</b> Cada fórmula sale de leer al revés la tabla de derivadas. \(C\) es la constante de integración.</p>
  <div class="my-3 overflow-x-auto"><table>
  <tr><td>\(\int x^n\,dx=\frac{x^{n+1}}{n+1}+C\ (n\ne-1)\)</td><td>\(\int\frac1x\,dx=\ln|x|+C\)</td></tr>
  <tr><td>\(\int e^x\,dx=e^x+C\)</td><td>\(\int\sin x\,dx=-\cos x+C\)</td></tr>
  <tr><td>\(\int\cos x\,dx=\sin x+C\)</td><td>\(\int\sec^2x\,dx=\tan x+C\)</td></tr>
  <tr><td>\(\int\csc^2x\,dx=-\cot x+C\)</td><td>\(\int\sec x\tan x\,dx=\sec x+C\)</td></tr>
  <tr><td>\(\int\frac{dx}{x^2+a^2}=\frac1a\arctan\frac xa+C\)</td><td>\(\int\frac{dx}{\sqrt{a^2-x^2}}=\arcsin\frac xa+C\)</td></tr>
  <tr><td>\(\int\tan x\,dx=\ln|\sec x|+C\)</td><td>\(\int k\,dx=kx+C\)</td></tr></table></div>
  <p><b>Linealidad:</b> \(\int[af+bg]\,dx=a\int f\,dx+b\int g\,dx\).</p>
  <p><b>Teorema Fundamental del Cálculo:</b> si \(F'=f\), entonces \(\int_a^b f(x)\,dx=F(b)-F(a)\).</p>`},
 {id:'limites', t:'Límites al infinito', html:R`
  <p><b>Lo más básico.</b> \(\lim_{t\to\infty}\frac1t=0\); en general \(\frac{\text{constante}}{\text{algo que crece}}\to0\).</p>
  <p><b>Ejemplo medio.</b> \(\lim_{t\to\infty}\arctan t=\frac\pi2\), \(\lim_{t\to-\infty}\arctan t=-\frac\pi2\).</p>
  <p><b>Ejemplo difícil (L'Hôpital).</b> \(\lim_{t\to-\infty}te^t=\lim_{t\to-\infty}\frac{t}{e^{-t}}\overset{\text{L'H}}=\lim_{t\to-\infty}\frac{1}{-e^{-t}}=0\). Se usa cuando aparece \(\frac{\infty}{\infty}\) o \(\frac00\).</p>`},
];

/* ---------- Lecciones ---------- */
const S = 'Stewart, <i>Cálculo de una variable: Trascendentes tempranas</i>';
const LESSONS = [
{ id:'l1', n:1, t:'Antiderivadas e integrales básicas', short:'Integrales básicas',
  bases:['potencias','derivadas','tabla'],
  intro:R`
  <p><b>¿Qué es integrar?</b> Encontrar una función \(F\) cuya derivada sea \(f\). Escribimos \(\int f(x)\,dx=F(x)+C\). La \(C\) aparece porque la derivada de una constante es cero, así que hay infinitas antiderivadas.</p>
  <p><b>Herramientas de esta lección:</b></p>
  <ul><li>Regla de la potencia: \(\int x^n\,dx=\dfrac{x^{n+1}}{n+1}+C\) (si \(n\ne-1\)).</li>
  <li>Linealidad: se integra término a término y las constantes salen.</li>
  <li>Teorema Fundamental: \(\int_a^bf\,dx=F(b)-F(a)\).</li></ul>
  <div class="my-3 rounded-r-xl border-l-4 border-emerald-600 bg-emerald-50 px-4 py-2.5 dark:border-emerald-500 dark:bg-emerald-950/40"><b>Truco de oro:</b> toda integral indefinida se comprueba <b>derivando</b> el resultado. Si obtienes el integrando, está bien.</div>`,
  examples:[
   {lvl:'basico', src:'Ejemplo de la guía', p:R`\int (3x^2+4x-5)\,dx`, steps:[
     [R`Separar: \(3\int x^2dx+4\int x\,dx-5\int dx\)`, R`Linealidad: la integral de una suma es la suma de integrales y las constantes salen.`],
     [R`Regla de la potencia: \(3\cdot\frac{x^3}{3}+4\cdot\frac{x^2}{2}-5x\)`, R`Se suma 1 al exponente y se divide por el nuevo exponente.`],
     [R`Simplificar y agregar \(C\).`, R`Toda integral indefinida lleva constante.`]],
     r:R`x^3+2x^2-5x+C`},
   {lvl:'medio', src:`${S}, §5.4, Ejemplo 2`, p:R`\int (10x^4-2\sec^2x)\,dx`, steps:[
     [R`Separar: \(10\int x^4dx-2\int\sec^2x\,dx\)`, R`Linealidad.`],
     [R`\(10\int x^4dx=10\cdot\frac{x^5}{5}=2x^5\)`, R`Regla de la potencia con \(n=4\).`],
     [R`\(\int\sec^2x\,dx=\tan x\)`, R`Porque \((\tan x)'=\sec^2x\) (ver <a href="#/bases/tabla">tabla</a>).`],
     [R`Comprobar: \(\frac{d}{dx}(2x^5-2\tan x)=10x^4-2\sec^2x\) ✓`, R`Derivar el resultado confirma la respuesta.`]],
     r:R`2x^5-2\tan x+C`},
   {lvl:'dificil', src:`${S}, §5.4, Ejemplo 5`, p:R`\int_1^9\frac{2t^2+t^2\sqrt t-1}{t^2}\,dt`, steps:[
     [R`Dividir cada término entre \(t^2\): \(\displaystyle\int_1^9\left(2+t^{1/2}-t^{-2}\right)dt\)`, R`No hay regla para el cociente directo; al simplificar quedan solo potencias (ver <a href="#/bases/potencias">potencias</a>).`],
     [R`Antiderivada: \(F(t)=2t+\frac{2}{3}t^{3/2}+t^{-1}\)`, R`Potencia: \(\int t^{1/2}=\frac{t^{3/2}}{3/2}\) y \(\int -t^{-2}=-\frac{t^{-1}}{-1}=\frac1t\).`],
     [R`\(F(9)=18+\frac23\cdot27+\frac19=36+\frac19\)`, R`\(9^{3/2}=(\sqrt9)^3=27\).`],
     [R`\(F(1)=2+\frac23+1=\frac{11}{3}\)`, R`Se evalúa en el límite inferior.`],
     [R`\(F(9)-F(1)=\frac{325}{9}-\frac{33}{9}=\frac{292}{9}\)`, R`Teorema Fundamental del Cálculo. (No se pone \(C\) en integrales definidas.)`]],
     r:R`\frac{292}{9}=32+\frac49`},
  ],
  exercises:[
   {src:'Ejercicio de práctica (tipo §5.4)', p:R`\int\left(x^2+x^{-2}\right)dx`, hint:R`Aplica la regla de la potencia a cada término; ojo con el exponente negativo.`,
    steps:[[R`\(\int x^2dx=\frac{x^3}{3}\)`,R`Potencia con \(n=2\).`],[R`\(\int x^{-2}dx=\frac{x^{-1}}{-1}=-\frac1x\)`,R`Potencia con \(n=-2\ (\ne-1)\).`]], r:R`\frac{x^3}{3}-\frac1x+C`},
   {src:'Ejercicio de práctica (tipo §5.4)', p:R`\int_0^{\pi/4}\sec^2t\,dt`, hint:R`¿Qué función tiene derivada \(\sec^2t\)?`,
    steps:[[R`Antiderivada: \(\tan t\)`,R`Tabla de integrales.`],[R`\(\tan\frac\pi4-\tan0=1-0\)`,R`Teorema Fundamental.`]], r:R`1`},
   {src:'Ejercicio de práctica (tipo §5.4)', p:R`\int(1-t)(2+t^2)\,dt`, hint:R`Primero multiplica: no existe "regla del producto" para integrales.`,
    steps:[[R`\((1-t)(2+t^2)=2-2t+t^2-t^3\)`,R`Expandir convierte el producto en suma de potencias.`],[R`Integrar término a término.`,R`Linealidad + potencia.`]], r:R`2t-t^2+\frac{t^3}{3}-\frac{t^4}{4}+C`},
  ]},

{ id:'l2', n:2, t:'Sustitución (cambio de variable)', short:'Sustitución',
  bases:['derivadas','potencias','logs','tabla'],
  intro:R`
  <p><b>Idea.</b> Es la regla de la cadena al revés: \(\displaystyle\int f(g(x))\,g'(x)\,dx=\int f(u)\,du\) con \(u=g(x)\).</p>
  <p><b>Receta:</b></p>
  <ol><li>Elige \(u\) = la función "de adentro" cuya derivada (o un múltiplo) aparece afuera.</li>
  <li>Calcula \(du=g'(x)\,dx\) y despeja lo que necesites.</li>
  <li>Reescribe <b>todo</b> en \(u\) (no debe quedar ninguna \(x\)).</li>
  <li>Integra y regresa a \(x\).</li></ol>
  <div class="my-3 rounded-r-xl border-l-4 border-blue-600 bg-blue-50 px-4 py-2.5 dark:border-blue-400 dark:bg-blue-950/40"><b>En integrales definidas</b> cambia también los límites: si \(x=a\) entonces \(u=g(a)\). Así no hace falta regresar a \(x\).</div>`,
  examples:[
   {lvl:'basico', src:`${S}, §5.5, Ejemplo 1`, p:R`\int x^3\cos(x^4+2)\,dx`, steps:[
     [R`Sea \(u=x^4+2\)`, R`Es la función de adentro del coseno y su derivada \(4x^3\) aparece (salvo el 4) afuera.`],
     [R`\(du=4x^3dx\Rightarrow x^3dx=\frac14du\)`, R`Despejamos exactamente lo que hay en la integral.`],
     [R`\(\int\cos u\cdot\frac14du=\frac14\sin u+C\)`, R`Ahora es una integral de tabla.`],
     [R`Regresar: \(u=x^4+2\)`, R`La respuesta debe quedar en la variable original.`]],
     r:R`\frac14\sin(x^4+2)+C`},
   {lvl:'medio', src:`${S}, §5.5, Ejemplo 3`, p:R`\int\frac{x}{\sqrt{1-4x^2}}\,dx`, steps:[
     [R`Sea \(u=1-4x^2\), \(du=-8x\,dx\Rightarrow x\,dx=-\frac18du\)`, R`La derivada del radicando es \(-8x\), y hay una \(x\) en el numerador.`],
     [R`\(-\frac18\int u^{-1/2}du\)`, R`\(\frac{1}{\sqrt u}=u^{-1/2}\) (ver <a href="#/bases/potencias">potencias</a>).`],
     [R`\(-\frac18\cdot\frac{u^{1/2}}{1/2}=-\frac14\sqrt u\)`, R`Regla de la potencia.`]],
     r:R`-\frac14\sqrt{1-4x^2}+C`},
   {lvl:'medio', src:`${S}, §5.5, Ejemplo 7`, p:R`\int_0^4\sqrt{2x+1}\,dx`, steps:[
     [R`\(u=2x+1,\ du=2dx\Rightarrow dx=\frac12du\)`, R`Función de adentro de la raíz.`],
     [R`Límites: \(x=0\to u=1\); \(x=4\to u=9\)`, R`En definidas cambiamos los límites para no regresar a \(x\).`],
     [R`\(\frac12\int_1^9u^{1/2}du=\frac12\cdot\frac23u^{3/2}\Big|_1^9=\frac13(27-1)\)`, R`Potencia y Teorema Fundamental.`]],
     r:R`\frac{26}{3}`},
   {lvl:'dificil', src:`${S}, §5.5, Ejemplo 5`, p:R`\int\sqrt{1+x^2}\,x^5\,dx`, steps:[
     [R`\(u=1+x^2,\ du=2x\,dx\)`, R`La raíz es la parte complicada.`],
     [R`Separar \(x^5dx=x^4\cdot x\,dx=(u-1)^2\cdot\frac12du\)`, R`Sobran \(x^4\); como \(x^2=u-1\), entonces \(x^4=(u-1)^2\). Así no queda ninguna \(x\).`],
     [R`\(\frac12\int\sqrt u\,(u^2-2u+1)\,du=\frac12\int\left(u^{5/2}-2u^{3/2}+u^{1/2}\right)du\)`, R`Expandir y multiplicar potencias.`],
     [R`\(\frac12\left(\frac27u^{7/2}-\frac45u^{5/2}+\frac23u^{3/2}\right)\)`, R`Potencia en cada término.`]],
     r:R`\frac17(1+x^2)^{7/2}-\frac25(1+x^2)^{5/2}+\frac13(1+x^2)^{3/2}+C`},
   {lvl:'dificil', src:`${S}, §5.5, Ejemplo 6`, p:R`\int\tan x\,dx`, steps:[
     [R`\(\tan x=\frac{\sin x}{\cos x}\)`, R`No está en la tabla básica; al escribirla con seno y coseno aparece "una función y su derivada".`],
     [R`\(u=\cos x,\ du=-\sin x\,dx\)`, R`La derivada del denominador está en el numerador.`],
     [R`\(-\int\frac{du}{u}=-\ln|u|=-\ln|\cos x|\)`, R`\(\int\frac1u du=\ln|u|\).`],
     [R`\(-\ln|\cos x|=\ln|\cos x|^{-1}=\ln|\sec x|\)`, R`Propiedad \(r\ln a=\ln a^r\) (ver <a href="#/bases/logs">logaritmos</a>).`]],
     r:R`\ln|\sec x|+C`},
  ],
  exercises:[
   {src:`${S}, §5.5, Ejemplo 9 (como ejercicio)`, p:R`\int_1^e\frac{\ln x}{x}\,dx`, hint:R`¿Cuál es la derivada de \(\ln x\)?`,
    steps:[[R`\(u=\ln x,\ du=\frac1xdx\)`,R`La derivada de \(\ln x\) está en la integral.`],[R`Límites: \(x=1\to u=0\); \(x=e\to u=1\)`,R`\(\ln1=0,\ \ln e=1\).`],[R`\(\int_0^1u\,du=\frac{u^2}{2}\Big|_0^1\)`,R`Potencia.`]], r:R`\frac12`},
   {src:'Ejercicio de práctica (tipo §5.5)', p:R`\int\cos x\,\sin^3x\,dx`, hint:R`Prueba \(u=\sin x\).`,
    steps:[[R`\(u=\sin x,\ du=\cos x\,dx\)`,R`\(\cos x\) es la derivada de \(\sin x\).`],[R`\(\int u^3du=\frac{u^4}{4}\)`,R`Potencia.`]], r:R`\frac{\sin^4x}{4}+C`},
   {src:'Ejercicio de práctica (tipo §5.5)', p:R`\int\frac{e^x}{1+e^x}\,dx`, hint:R`El numerador es la derivada del denominador.`,
    steps:[[R`\(u=1+e^x,\ du=e^xdx\)`,R`Derivada del denominador arriba.`],[R`\(\int\frac{du}{u}=\ln|u|\)`,R`Tabla; \(1+e^x>0\) así que se quita el valor absoluto.`]], r:R`\ln(1+e^x)+C`},
   {src:'Ejercicio de práctica (tipo §5.5)', p:R`\int x\,e^{-x^2}\,dx`, hint:R`\(u=-x^2\).`,
    steps:[[R`\(u=-x^2,\ du=-2x\,dx\Rightarrow x\,dx=-\frac12du\)`,R`El exponente es la función de adentro.`],[R`\(-\frac12\int e^udu=-\frac12e^u\)`,R`\(\int e^u du=e^u\).`]], r:R`-\frac12e^{-x^2}+C`},
  ]},

{ id:'l3', n:3, t:'Integración por partes', short:'Por partes',
  bases:['derivadas','logs','tabla','trig'],
  intro:R`
  <p><b>Idea.</b> Viene de la regla del producto \((uv)'=u'v+uv'\). Integrando y despejando:</p>
  \[\int u\,dv=uv-\int v\,du\]
  <p><b>¿Cuándo?</b> Cuando el integrando es un <b>producto</b> de funciones de distinto tipo (polinomio · exponencial, polinomio · trig, logaritmo, funciones inversas).</p>
  <p><b>¿Cómo elegir \(u\)?</b> Regla <b>LIATE</b>: elige como \(u\) la que aparezca primero en: <b>L</b>ogarítmica, <b>I</b>nversa trig., <b>A</b>lgebraica (polinomio), <b>T</b>rigonométrica, <b>E</b>xponencial. Lo que queda es \(dv\).</p>
  <div class="my-3 rounded-r-xl border-l-4 border-amber-500 bg-amber-50 px-4 py-2.5 dark:border-amber-400 dark:bg-amber-950/40">Objetivo: que la nueva integral \(\int v\,du\) sea <b>más fácil</b> que la original. Si se complica, intercambia \(u\) y \(dv\).</div>`,
  examples:[
   {lvl:'basico', src:`${S}, §7.1, Ejemplo 1`, p:R`\int x\sin x\,dx`, steps:[
     [R`\(u=x,\ dv=\sin x\,dx\)`, R`LIATE: algebraica antes que trigonométrica. Al derivar \(x\) se vuelve 1.`],
     [R`\(du=dx,\ v=-\cos x\)`, R`Derivamos \(u\) e integramos \(dv\).`],
     [R`\(\int x\sin x\,dx=-x\cos x-\int(-\cos x)\,dx\)`, R`Fórmula \(uv-\int v\,du\).`],
     [R`\(=-x\cos x+\sin x+C\)`, R`\(\int\cos x\,dx=\sin x\).`]],
     r:R`-x\cos x+\sin x+C`},
   {lvl:'medio', src:`${S}, §7.1, Ejemplo 2`, p:R`\int\ln x\,dx`, steps:[
     [R`\(u=\ln x,\ dv=dx\)`, R`No sabemos integrar \(\ln x\) directamente, pero sí derivarlo. El "otro factor" es \(1\).`],
     [R`\(du=\frac1xdx,\ v=x\)`, R`Derivada de \(\ln x\).`],
     [R`\(x\ln x-\int x\cdot\frac1x\,dx=x\ln x-\int dx\)`, R`La nueva integral es trivial.`]],
     r:R`x\ln x-x+C`},
   {lvl:'medio', src:`${S}, §7.1, Ejemplo 3`, p:R`\int t^2e^t\,dt`, steps:[
     [R`\(u=t^2,\ dv=e^tdt\Rightarrow du=2t\,dt,\ v=e^t\)`, R`Al derivar \(t^2\) baja el grado.`],
     [R`\(t^2e^t-2\int te^t\,dt\)`, R`La nueva integral tiene \(t\) en vez de \(t^2\): progreso.`],
     [R`Otra vez partes: \(u=t,\ dv=e^tdt\Rightarrow\int te^tdt=te^t-e^t\)`, R`Se repite hasta que el polinomio desaparece.`],
     [R`\(t^2e^t-2(te^t-e^t)+C\)`, R`Sustituimos y distribuimos el \(-2\).`]],
     r:R`t^2e^t-2te^t+2e^t+C`},
   {lvl:'dificil', src:`${S}, §7.1, Ejemplo 4`, p:R`\int e^x\sin x\,dx`, steps:[
     [R`Llamemos \(I=\int e^x\sin x\,dx\). Partes con \(u=\sin x,\ dv=e^xdx\): \(I=e^x\sin x-\int e^x\cos x\,dx\)`, R`Ningún factor "desaparece" al derivar: es un caso <b>cíclico</b>.`],
     [R`Partes otra vez con \(u=\cos x,\ dv=e^xdx\): \(\int e^x\cos x\,dx=e^x\cos x+\int e^x\sin x\,dx\)`, R`Hay que mantener la misma elección (la trig. como \(u\)) para no deshacer el paso anterior.`],
     [R`\(I=e^x\sin x-e^x\cos x-I\)`, R`¡Reaparece la integral original!`],
     [R`\(2I=e^x(\sin x-\cos x)\Rightarrow I=\frac12e^x(\sin x-\cos x)\)`, R`Se despeja \(I\) como en una ecuación.`]],
     r:R`\frac12e^x(\sin x-\cos x)+C`},
   {lvl:'dificil', src:`${S}, §7.1, Ejemplo 5`, p:R`\int_0^1\arctan x\,dx`, steps:[
     [R`\(u=\arctan x,\ dv=dx\Rightarrow du=\frac{dx}{1+x^2},\ v=x\)`, R`LIATE: inversa trigonométrica primero. Igual que con \(\ln x\).`],
     [R`\(x\arctan x\Big|_0^1-\int_0^1\frac{x}{1+x^2}dx\)`, R`Partes para definidas: \(uv\big|_a^b-\int_a^bv\,du\).`],
     [R`\(x\arctan x\big|_0^1=\frac\pi4\)`, R`\(\arctan1=\frac\pi4\).`],
     [R`\(\int_0^1\frac{x}{1+x^2}dx=\frac12\ln(1+x^2)\Big|_0^1=\frac12\ln2\)`, R`<a href="#/l2">Sustitución</a> \(t=1+x^2\).`]],
     r:R`\frac\pi4-\frac12\ln2`},
  ],
  exercises:[
   {src:'Ejercicio de práctica (tipo §7.1)', p:R`\int x\,e^{2x}\,dx`, hint:R`\(u=x,\ dv=e^{2x}dx\).`,
    steps:[[R`\(du=dx,\ v=\frac12e^{2x}\)`,R`\(\int e^{2x}dx=\frac12e^{2x}\).`],[R`\(\frac12xe^{2x}-\frac12\int e^{2x}dx\)`,R`Fórmula de partes.`]], r:R`\frac12xe^{2x}-\frac14e^{2x}+C`},
   {src:'Ejercicio de práctica (tipo §7.1)', p:R`\int x^2\ln x\,dx`, hint:R`LIATE: el logaritmo va como \(u\).`,
    steps:[[R`\(u=\ln x,\ dv=x^2dx\Rightarrow du=\frac{dx}{x},\ v=\frac{x^3}{3}\)`,R`Logaritmo primero.`],[R`\(\frac{x^3}{3}\ln x-\int\frac{x^2}{3}dx\)`,R`Se simplifica \(\frac{x^3}{3}\cdot\frac1x\).`]], r:R`\frac{x^3}{3}\ln x-\frac{x^3}{9}+C`},
   {src:'Ejercicio de práctica (tipo §7.1)', p:R`\int x\cos5x\,dx`, hint:R`\(u=x\), \(v=\frac15\sin5x\).`,
    steps:[[R`\(u=x,\ dv=\cos5x\,dx\Rightarrow v=\frac15\sin5x\)`,R`Algebraica antes que trig.`],[R`\(\frac{x}{5}\sin5x-\frac15\int\sin5x\,dx\)`,R`Fórmula de partes.`],[R`\(-\frac15\cdot\left(-\frac15\cos5x\right)\)`,R`\(\int\sin5x\,dx=-\frac15\cos5x\).`]], r:R`\frac{x}{5}\sin5x+\frac1{25}\cos5x+C`},
  ]},

{ id:'l4', n:4, t:'Integrales trigonométricas', short:'Trigonométricas',
  bases:['trig','tabla','derivadas'],
  intro:R`
  <p><b>Idea.</b> Integrales con potencias de \(\sin,\cos,\tan,\sec\). Se usan identidades para llevarlas a una <a href="#/l2">sustitución</a> sencilla.</p>
  <div class="my-3 overflow-x-auto"><table><tr><th>Caso</th><th>Estrategia</th></tr>
  <tr><td>\(\int\sin^mx\cos^nx\,dx\), potencia de <b>coseno impar</b></td><td>Guarda un \(\cos x\), el resto a seno con \(\cos^2=1-\sin^2\); \(u=\sin x\).</td></tr>
  <tr><td>Potencia de <b>seno impar</b></td><td>Guarda un \(\sin x\), el resto a coseno; \(u=\cos x\).</td></tr>
  <tr><td><b>Ambas pares</b></td><td>Ángulo medio: \(\sin^2x=\frac12(1-\cos2x)\), \(\cos^2x=\frac12(1+\cos2x)\).</td></tr>
  <tr><td>\(\int\tan^mx\sec^nx\,dx\), \(\sec\) <b>par</b></td><td>Guarda \(\sec^2x\), el resto a \(\tan\) con \(\sec^2=1+\tan^2\); \(u=\tan x\).</td></tr>
  <tr><td>\(\tan\) <b>impar</b></td><td>Guarda \(\sec x\tan x\), el resto a \(\sec\); \(u=\sec x\).</td></tr></table></div>`,
  examples:[
   {lvl:'basico', src:`${S}, §7.2, Ejemplo 1`, p:R`\int\cos^3x\,dx`, steps:[
     [R`\(\cos^3x=\cos^2x\cdot\cos x=(1-\sin^2x)\cos x\)`, R`Potencia impar de coseno: se guarda un \(\cos x\) para que sea el \(du\).`],
     [R`\(u=\sin x,\ du=\cos x\,dx\)`, R`Sustitución.`],
     [R`\(\int(1-u^2)\,du=u-\frac{u^3}{3}\)`, R`Polinomio.`]],
     r:R`\sin x-\frac13\sin^3x+C`},
   {lvl:'medio', src:`${S}, §7.2, Ejemplo 2`, p:R`\int\sin^5x\cos^2x\,dx`, steps:[
     [R`\(\sin^5x=(\sin^2x)^2\sin x=(1-\cos^2x)^2\sin x\)`, R`Seno impar: guardamos un \(\sin x\).`],
     [R`\(u=\cos x,\ du=-\sin x\,dx\)`, R`El \(\sin x\,dx\) guardado es \(-du\).`],
     [R`\(-\int(1-u^2)^2u^2\,du=-\int(u^2-2u^4+u^6)\,du\)`, R`Expandir \((1-u^2)^2=1-2u^2+u^4\) y multiplicar por \(u^2\).`],
     [R`\(-\left(\frac{u^3}{3}-\frac{2u^5}{5}+\frac{u^7}{7}\right)\)`, R`Potencia; luego \(u=\cos x\).`]],
     r:R`-\frac13\cos^3x+\frac25\cos^5x-\frac17\cos^7x+C`},
   {lvl:'medio', src:`${S}, §7.2, Ejemplo 3`, p:R`\int_0^\pi\sin^2x\,dx`, steps:[
     [R`\(\sin^2x=\frac12(1-\cos2x)\)`, R`Potencia par: no se puede guardar un factor; se usa ángulo medio.`],
     [R`\(\frac12\left[x-\frac12\sin2x\right]_0^\pi\)`, R`\(\int\cos2x\,dx=\frac12\sin2x\).`],
     [R`\(\frac12\left[(\pi-0)-(0-0)\right]\)`, R`\(\sin2\pi=\sin0=0\).`]],
     r:R`\frac\pi2`},
   {lvl:'dificil', src:`${S}, §7.2, Ejemplo 4`, p:R`\int\sin^4x\,dx`, steps:[
     [R`\(\sin^4x=(\sin^2x)^2=\frac14(1-\cos2x)^2=\frac14(1-2\cos2x+\cos^22x)\)`, R`Ángulo medio una vez.`],
     [R`\(\cos^22x=\frac12(1+\cos4x)\)`, R`Aparece otra potencia par: ángulo medio otra vez.`],
     [R`\(\frac14\int\left(\frac32-2\cos2x+\frac12\cos4x\right)dx\)`, R`Agrupar constantes: \(1+\frac12=\frac32\).`],
     [R`\(\frac14\left(\frac32x-\sin2x+\frac18\sin4x\right)\)`, R`\(\int\cos kx\,dx=\frac1k\sin kx\).`]],
     r:R`\frac38x-\frac14\sin2x+\frac1{32}\sin4x+C`},
   {lvl:'dificil', src:`${S}, §7.2, Ejemplo 5`, p:R`\int\tan^6x\sec^4x\,dx`, steps:[
     [R`\(\sec^4x=\sec^2x\cdot\sec^2x=(1+\tan^2x)\sec^2x\)`, R`Secante par: se guarda \(\sec^2x\) que es la derivada de \(\tan x\).`],
     [R`\(u=\tan x,\ du=\sec^2x\,dx\)`, R`Sustitución.`],
     [R`\(\int u^6(1+u^2)\,du=\int(u^6+u^8)\,du\)`, R`Polinomio.`]],
     r:R`\frac17\tan^7x+\frac19\tan^9x+C`},
  ],
  exercises:[
   {src:'Ejercicio de práctica (tipo §7.2)', p:R`\int\sin^3x\,dx`, hint:R`Seno impar: guarda un \(\sin x\), \(u=\cos x\).`,
    steps:[[R`\((1-\cos^2x)\sin x\), \(u=\cos x\)`,R`Seno impar.`],[R`\(-\int(1-u^2)du=-u+\frac{u^3}{3}\)`,R`\(\sin x\,dx=-du\).`]], r:R`-\cos x+\frac13\cos^3x+C`},
   {src:'Ejercicio de práctica (tipo §7.2)', p:R`\int_0^{\pi/2}\cos^2x\,dx`, hint:R`Ángulo medio.`,
    steps:[[R`\(\frac12\int_0^{\pi/2}(1+\cos2x)dx\)`,R`Potencia par.`],[R`\(\frac12\left[x+\frac12\sin2x\right]_0^{\pi/2}=\frac12\cdot\frac\pi2\)`,R`\(\sin\pi=0\).`]], r:R`\frac\pi4`},
   {src:'Ejercicio de práctica (tipo §7.2)', p:R`\int\sin^2x\cos^3x\,dx`, hint:R`El coseno es impar.`,
    steps:[[R`\(\sin^2x(1-\sin^2x)\cos x\), \(u=\sin x\)`,R`Guardar un \(\cos x\).`],[R`\(\int(u^2-u^4)du\)`,R`Expandir.`]], r:R`\frac13\sin^3x-\frac15\sin^5x+C`},
  ]},

{ id:'l5', n:5, t:'Sustitución trigonométrica', short:'Sustitución trig.',
  bases:['trig','triangulo','derivadas','tabla'],
  intro:R`
  <p><b>Idea.</b> Cuando aparece una raíz de la forma \(\sqrt{a^2\pm x^2}\) o \(\sqrt{x^2-a^2}\), se cambia \(x\) por una función trigonométrica para que una identidad <b>elimine la raíz</b>.</p>
  <div class="my-3 overflow-x-auto"><table><tr><th>Expresión</th><th>Sustitución</th><th>Identidad que usa</th></tr>
  <tr><td>\(\sqrt{a^2-x^2}\)</td><td>\(x=a\sin\theta\)</td><td>\(1-\sin^2\theta=\cos^2\theta\)</td></tr>
  <tr><td>\(\sqrt{a^2+x^2}\)</td><td>\(x=a\tan\theta\)</td><td>\(1+\tan^2\theta=\sec^2\theta\)</td></tr>
  <tr><td>\(\sqrt{x^2-a^2}\)</td><td>\(x=a\sec\theta\)</td><td>\(\sec^2\theta-1=\tan^2\theta\)</td></tr></table></div>
  <p>Al final se regresa a \(x\) con el <a href="#/bases/triangulo">triángulo de referencia</a>.</p>`,
  examples:[
   {lvl:'basico', src:'Ejemplo de la guía', p:R`\int\frac{dx}{\sqrt{4-x^2}}`, steps:[
     [R`\(x=2\sin\theta,\ dx=2\cos\theta\,d\theta\)`, R`Forma \(\sqrt{a^2-x^2}\) con \(a=2\).`],
     [R`\(\sqrt{4-4\sin^2\theta}=2\cos\theta\)`, R`\(1-\sin^2\theta=\cos^2\theta\); la raíz desaparece.`],
     [R`\(\int\frac{2\cos\theta}{2\cos\theta}d\theta=\int d\theta=\theta\)`, R`Todo se simplifica.`],
     [R`\(\theta=\arcsin\frac x2\)`, R`De \(x=2\sin\theta\).`]],
     r:R`\arcsin\frac x2+C`},
   {lvl:'medio', src:`${S}, §7.3, Ejemplo 1`, p:R`\int\frac{\sqrt{9-x^2}}{x^2}\,dx`, steps:[
     [R`\(x=3\sin\theta,\ dx=3\cos\theta\,d\theta,\ \sqrt{9-x^2}=3\cos\theta\)`, R`Forma \(\sqrt{a^2-x^2}\), \(a=3\).`],
     [R`\(\int\frac{3\cos\theta}{9\sin^2\theta}\,3\cos\theta\,d\theta=\int\cot^2\theta\,d\theta\)`, R`\(\frac{\cos^2\theta}{\sin^2\theta}=\cot^2\theta\).`],
     [R`\(\int(\csc^2\theta-1)\,d\theta=-\cot\theta-\theta\)`, R`Identidad \(\cot^2=\csc^2-1\) y tabla.`],
     [R`Triángulo: \(\sin\theta=\frac x3\Rightarrow\cot\theta=\frac{\sqrt{9-x^2}}{x}\)`, R`Opuesto \(x\), hipotenusa 3, adyacente \(\sqrt{9-x^2}\).`]],
     r:R`-\frac{\sqrt{9-x^2}}{x}-\arcsin\frac x3+C`},
   {lvl:'dificil', src:`${S}, §7.3, Ejemplo 3`, p:R`\int\frac{dx}{x^2\sqrt{x^2+4}}`, steps:[
     [R`\(x=2\tan\theta,\ dx=2\sec^2\theta\,d\theta,\ \sqrt{x^2+4}=2\sec\theta\)`, R`Forma \(\sqrt{x^2+a^2}\).`],
     [R`\(\int\frac{2\sec^2\theta}{4\tan^2\theta\cdot2\sec\theta}d\theta=\frac14\int\frac{\sec\theta}{\tan^2\theta}d\theta\)`, R`Simplificar.`],
     [R`\(\frac{\sec\theta}{\tan^2\theta}=\frac{1/\cos\theta}{\sin^2\theta/\cos^2\theta}=\frac{\cos\theta}{\sin^2\theta}\)`, R`Pasar a seno y coseno.`],
     [R`\(u=\sin\theta:\ \frac14\int u^{-2}du=-\frac1{4\sin\theta}\)`, R`<a href="#/l2">Sustitución</a>.`],
     [R`Triángulo: \(\tan\theta=\frac x2\Rightarrow\) hip \(=\sqrt{x^2+4}\), \(\frac1{\sin\theta}=\frac{\sqrt{x^2+4}}{x}\)`, R`Regresar a \(x\).`]],
     r:R`-\frac{\sqrt{x^2+4}}{4x}+C`},
  ],
  exercises:[
   {src:'Ejercicio de práctica (tipo §7.3)', p:R`\int\frac{x^2}{\sqrt{9-x^2}}\,dx`, hint:R`\(x=3\sin\theta\); luego ángulo medio.`,
    steps:[[R`\(\int\frac{9\sin^2\theta}{3\cos\theta}3\cos\theta\,d\theta=9\int\sin^2\theta\,d\theta\)`,R`La raíz se cancela.`],[R`\(\frac92(\theta-\sin\theta\cos\theta)\)`,R`Ángulo medio y \(\sin2\theta=2\sin\theta\cos\theta\).`],[R`\(\sin\theta=\frac x3,\ \cos\theta=\frac{\sqrt{9-x^2}}{3}\)`,R`Triángulo.`]], r:R`\frac92\arcsin\frac x3-\frac x2\sqrt{9-x^2}+C`},
   {src:'Ejercicio de práctica (tipo §7.3)', p:R`\int\frac{dx}{x^2+9}`, hint:R`\(x=3\tan\theta\).`,
    steps:[[R`\(dx=3\sec^2\theta\,d\theta,\ x^2+9=9\sec^2\theta\)`,R`\(1+\tan^2=\sec^2\).`],[R`\(\frac13\int d\theta=\frac\theta3\)`,R`Se cancela.`]], r:R`\frac13\arctan\frac x3+C`},
   {src:'Ejercicio de práctica (tipo §7.3)', p:R`\int\sqrt{1-x^2}\,dx`, hint:R`Es como el ejercicio 5 del examen con \(a=1\).`,
    steps:[[R`\(x=\sin\theta:\ \int\cos^2\theta\,d\theta\)`,R`La raíz da \(\cos\theta\).`],[R`\(\frac12(\theta+\sin\theta\cos\theta)\)`,R`Ángulo medio.`]], r:R`\frac12\left(\arcsin x+x\sqrt{1-x^2}\right)+C`},
  ]},

{ id:'l6', n:6, t:'Fracciones parciales', short:'Fracciones parciales',
  bases:['factorizacion','division','logs','completar','tabla'],
  intro:R`
  <p><b>Idea.</b> Una fracción de polinomios se descompone en fracciones simples que se integran con \(\ln\) o \(\arctan\).</p>
  <ol><li>Si es <b>impropia</b> (grado arriba \(\ge\) grado abajo), <a href="#/bases/division">divide</a> primero.</li>
  <li><a href="#/bases/factorizacion">Factoriza</a> el denominador.</li>
  <li>Plantea la descomposición según el tipo de factor:</li></ol>
  <div class="my-3 overflow-x-auto"><table><tr><th>Factor en el denominador</th><th>Término(s)</th></tr>
  <tr><td>Lineal \((ax+b)\)</td><td>\(\frac{A}{ax+b}\)</td></tr>
  <tr><td>Lineal repetido \((ax+b)^2\)</td><td>\(\frac{A}{ax+b}+\frac{B}{(ax+b)^2}\)</td></tr>
  <tr><td>Cuadrático irreducible \(ax^2+bx+c\)</td><td>\(\frac{Ax+B}{ax^2+bx+c}\)</td></tr></table></div>
  <div class="my-3 rounded-r-xl border-l-4 border-blue-600 bg-blue-50 px-4 py-2.5 dark:border-blue-400 dark:bg-blue-950/40"><b>Truco:</b> para hallar las constantes, evalúa en las raíces del denominador; cada una "apaga" los demás términos.</div>`,
  examples:[
   {lvl:'basico', src:`${S}, §7.4, Ejemplo 1`, p:R`\int\frac{x^3+x}{x-1}\,dx`, steps:[
     [R`Es impropia (grado 3 sobre grado 1): \(\frac{x^3+x}{x-1}=x^2+x+2+\frac{2}{x-1}\)`, R`<a href="#/bases/division">División de polinomios</a>.`],
     [R`Integrar término a término.`, R`\(\int\frac{2}{x-1}dx=2\ln|x-1|\) (sustitución \(u=x-1\)).`]],
     r:R`\frac{x^3}{3}+\frac{x^2}{2}+2x+2\ln|x-1|+C`},
   {lvl:'medio', src:`${S}, §7.4, Ejemplo 2`, p:R`\int\frac{x^2+2x-1}{2x^3+3x^2-2x}\,dx`, steps:[
     [R`\(2x^3+3x^2-2x=x(2x-1)(x+2)\)`, R`Factor común y trinomio.`],
     [R`\(\frac{x^2+2x-1}{x(2x-1)(x+2)}=\frac Ax+\frac B{2x-1}+\frac C{x+2}\)`, R`Tres factores lineales distintos.`],
     [R`\(x^2+2x-1=A(2x-1)(x+2)+Bx(x+2)+Cx(2x-1)\)`, R`Multiplicar por el denominador común.`],
     [R`\(x=0:\ -1=-2A\Rightarrow A=\frac12\); \(x=\frac12:\ \frac14=\frac54B\Rightarrow B=\frac15\); \(x=-2:\ -1=10C\Rightarrow C=-\frac1{10}\)`, R`Evaluar en las raíces.`],
     [R`\(\frac12\ln|x|+\frac15\cdot\frac12\ln|2x-1|-\frac1{10}\ln|x+2|\)`, R`\(\int\frac{dx}{2x-1}=\frac12\ln|2x-1|\).`]],
     r:R`\frac12\ln|x|+\frac1{10}\ln|2x-1|-\frac1{10}\ln|x+2|+C`},
   {lvl:'medio', src:`${S}, §7.4, Ejemplo 3`, p:R`\int\frac{dx}{x^2-a^2}\quad(a\ne0)`, steps:[
     [R`\(\frac1{(x-a)(x+a)}=\frac A{x-a}+\frac B{x+a}\)`, R`Diferencia de cuadrados.`],
     [R`\(1=A(x+a)+B(x-a)\); \(x=a:\ A=\frac1{2a}\); \(x=-a:\ B=-\frac1{2a}\)`, R`Evaluar en las raíces.`],
     [R`\(\frac1{2a}\left(\ln|x-a|-\ln|x+a|\right)\)`, R`Juntar con \(\ln\frac ab\).`]],
     r:R`\frac1{2a}\ln\left|\frac{x-a}{x+a}\right|+C`},
   {lvl:'dificil', src:`${S}, §7.4, Ejemplo 4`, p:R`\int\frac{x^4-2x^2+4x+1}{x^3-x^2-x+1}\,dx`, steps:[
     [R`Dividir: \(\frac{x^4-2x^2+4x+1}{x^3-x^2-x+1}=x+1+\frac{4x}{x^3-x^2-x+1}\)`, R`Impropia. Comprobación: \((x+1)(x^3-x^2-x+1)=x^4-2x^2+1\); residuo \(4x\).`],
     [R`\(x^3-x^2-x+1=(x-1)^2(x+1)\)`, R`Agrupación (ver <a href="#/bases/factorizacion">factorización</a>).`],
     [R`\(\frac{4x}{(x-1)^2(x+1)}=\frac A{x-1}+\frac B{(x-1)^2}+\frac C{x+1}\)`, R`Factor repetido: un término por cada potencia.`],
     [R`\(4x=A(x-1)(x+1)+B(x+1)+C(x-1)^2\). \(x=1:\ B=2\); \(x=-1:\ C=-1\); coef. de \(x^2\): \(A+C=0\Rightarrow A=1\)`, R`Cuando no hay más raíces se igualan coeficientes.`],
     [R`\(\int\left(x+1+\frac1{x-1}+\frac2{(x-1)^2}-\frac1{x+1}\right)dx\)`, R`\(\int\frac{2}{(x-1)^2}dx=-\frac2{x-1}\) (potencia \(-2\)).`]],
     r:R`\frac{x^2}{2}+x-\frac{2}{x-1}+\ln\left|\frac{x-1}{x+1}\right|+C`},
   {lvl:'dificil', src:`${S}, §7.4, Ejemplo 5`, p:R`\int\frac{2x^2-x+4}{x^3+4x}\,dx`, steps:[
     [R`\(x^3+4x=x(x^2+4)\)`, R`\(x^2+4\) es irreducible.`],
     [R`\(\frac{2x^2-x+4}{x(x^2+4)}=\frac Ax+\frac{Bx+C}{x^2+4}\)`, R`Al cuadrático irreducible le toca numerador lineal.`],
     [R`\(2x^2-x+4=(A+B)x^2+Cx+4A\Rightarrow A=1,\ C=-1,\ B=1\)`, R`Igualar coeficientes.`],
     [R`\(\int\frac{dx}{x}+\int\frac{x\,dx}{x^2+4}-\int\frac{dx}{x^2+4}\)`, R`Separar: la segunda es sustitución, la tercera es arctan.`]],
     r:R`\ln|x|+\frac12\ln(x^2+4)-\frac12\arctan\frac x2+C`},
  ],
  exercises:[
   {src:'Ejercicio de práctica (tipo §7.4)', p:R`\int\frac{5}{(x-1)(x+4)}\,dx`, hint:R`Evalúa en \(x=1\) y \(x=-4\).`,
    steps:[[R`\(5=A(x+4)+B(x-1)\Rightarrow A=1,\ B=-1\)`,R`Raíces.`],[R`\(\ln|x-1|-\ln|x+4|\)`,R`Tabla.`]], r:R`\ln\left|\frac{x-1}{x+4}\right|+C`},
   {src:'Ejercicio de práctica (tipo §7.4)', p:R`\int\frac{x+1}{x^2-x-6}\,dx`, hint:R`\(x^2-x-6=(x-3)(x+2)\).`,
    steps:[[R`\(x+1=A(x+2)+B(x-3)\)`,R`Plantear.`],[R`\(x=3:\ A=\frac45\); \(x=-2:\ B=\frac15\)`,R`Raíces.`]], r:R`\frac45\ln|x-3|+\frac15\ln|x+2|+C`},
   {src:'Ejercicio de práctica (tipo §7.4)', p:R`\int\frac{dx}{x(x+1)^2}`, hint:R`Factor repetido: \(\frac Ax+\frac B{x+1}+\frac C{(x+1)^2}\).`,
    steps:[[R`\(1=A(x+1)^2+Bx(x+1)+Cx\)`,R`Plantear.`],[R`\(x=0:\ A=1\); \(x=-1:\ C=-1\); coef. \(x^2\): \(A+B=0\Rightarrow B=-1\)`,R`Raíces y coeficientes.`],[R`\(\ln|x|-\ln|x+1|+\frac1{x+1}\)`,R`\(\int-\frac{dx}{(x+1)^2}=\frac1{x+1}\).`]], r:R`\ln\left|\frac{x}{x+1}\right|+\frac1{x+1}+C`},
  ]},

{ id:'l7', n:7, t:'Integrales impropias', short:'Impropias',
  bases:['limites','tabla','logs'],
  intro:R`
  <p><b>Idea.</b> Integrales con un límite infinito (tipo 1) o con el integrando que "explota" en el intervalo (tipo 2). Se reemplazan por un <b>límite</b>:</p>
  \[\int_a^\infty f(x)\,dx=\lim_{t\to\infty}\int_a^tf(x)\,dx\qquad \int_a^bf(x)\,dx=\lim_{t\to a^+}\int_t^bf(x)\,dx\ \text{(si } f \text{ explota en } a)\]
  <p>Si el límite existe y es finito, la integral <b>converge</b>; si no, <b>diverge</b>.</p>
  <div class="my-3 rounded-r-xl border-l-4 border-blue-600 bg-blue-50 px-4 py-2.5 dark:border-blue-400 dark:bg-blue-950/40"><b>Integrales p:</b> \(\int_1^\infty\frac{dx}{x^p}\) converge si \(p>1\) y diverge si \(p\le1\).</div>
  <div class="my-3 rounded-r-xl border-l-4 border-amber-500 bg-amber-50 px-4 py-2.5 dark:border-amber-400 dark:bg-amber-950/40">Si ambos límites son infinitos, separa en un punto (por ejemplo 0) y ambas partes deben converger.</div>`,
  examples:[
   {lvl:'basico', src:`${S}, §7.8, Ejemplo 1`, p:R`\int_1^\infty\frac{dx}{x}`, steps:[
     [R`\(\lim_{t\to\infty}\int_1^t\frac{dx}{x}=\lim_{t\to\infty}\left[\ln|x|\right]_1^t\)`, R`Definición de integral impropia tipo 1.`],
     [R`\(=\lim_{t\to\infty}(\ln t-\ln1)=\lim_{t\to\infty}\ln t=\infty\)`, R`El logaritmo crece sin límite.`]],
     r:R`\text{Diverge}`},
   {lvl:'basico', src:`${S}, §7.8 (comparación junto al Ejemplo 1)`, p:R`\int_1^\infty\frac{dx}{x^2}`, steps:[
     [R`\(\lim_{t\to\infty}\left[-\frac1x\right]_1^t=\lim_{t\to\infty}\left(1-\frac1t\right)\)`, R`Potencia \(n=-2\).`],
     [R`\(\frac1t\to0\)`, R`Ver <a href="#/bases/limites">límites</a>.`]],
     r:R`1\ \text{(converge)}`},
   {lvl:'medio', src:`${S}, §7.8, Ejemplo 2`, p:R`\int_{-\infty}^0xe^x\,dx`, steps:[
     [R`\(\lim_{t\to-\infty}\int_t^0xe^x\,dx\)`, R`Límite inferior infinito.`],
     [R`<a href="#/l3">Partes</a>: \(\int xe^x\,dx=xe^x-e^x\)`, R`\(u=x,\ dv=e^xdx\).`],
     [R`\(\left[xe^x-e^x\right]_t^0=-1-te^t+e^t\)`, R`Evaluar.`],
     [R`\(te^t\to0\) (L'Hôpital) y \(e^t\to0\)`, R`Ver <a href="#/bases/limites">límites</a>.`]],
     r:R`-1`},
   {lvl:'medio', src:`${S}, §7.8, Ejemplo 3`, p:R`\int_{-\infty}^{\infty}\frac{dx}{1+x^2}`, steps:[
     [R`Separar en 0: \(\int_{-\infty}^0+\int_0^\infty\)`, R`Ambos extremos son infinitos.`],
     [R`\(\int_0^\infty\frac{dx}{1+x^2}=\lim_{t\to\infty}\arctan t=\frac\pi2\)`, R`Tabla: \(\int\frac{dx}{1+x^2}=\arctan x\).`],
     [R`\(\int_{-\infty}^0\frac{dx}{1+x^2}=0-\lim_{t\to-\infty}\arctan t=\frac\pi2\)`, R`\(\arctan t\to-\frac\pi2\).`]],
     r:R`\pi`},
   {lvl:'dificil', src:`${S}, §7.8, Ejemplo 5`, p:R`\int_2^5\frac{dx}{\sqrt{x-2}}`, steps:[
     [R`El integrando explota en \(x=2\): \(\lim_{t\to2^+}\int_t^5(x-2)^{-1/2}dx\)`, R`Tipo 2: asíntota vertical en el extremo.`],
     [R`\(=\lim_{t\to2^+}\left[2\sqrt{x-2}\right]_t^5=\lim_{t\to2^+}\left(2\sqrt3-2\sqrt{t-2}\right)\)`, R`Potencia \(-\frac12\).`]],
     r:R`2\sqrt3`},
  ],
  exercises:[
   {src:'Ejercicio de práctica (tipo §7.8)', p:R`\int_0^\infty e^{-2x}\,dx`, hint:R`\(\int e^{-2x}dx=-\frac12e^{-2x}\).`,
    steps:[[R`\(\lim_{t\to\infty}\left[-\frac12e^{-2x}\right]_0^t=\lim\left(-\frac12e^{-2t}+\frac12\right)\)`,R`Definición.`],[R`\(e^{-2t}\to0\)`,R`Límites.`]], r:R`\frac12`},
   {src:'Ejercicio de práctica (tipo §7.8)', p:R`\int_1^\infty\frac{dx}{x^3}`, hint:R`Integral p con \(p=3>1\).`,
    steps:[[R`\(\lim_{t\to\infty}\left[-\frac1{2x^2}\right]_1^t=\lim\left(\frac12-\frac1{2t^2}\right)\)`,R`Potencia.`]], r:R`\frac12`},
   {src:'Ejercicio de práctica (tipo §7.8)', p:R`\int_0^1\frac{dx}{\sqrt x}`, hint:R`Tipo 2: explota en 0.`,
    steps:[[R`\(\lim_{t\to0^+}\left[2\sqrt x\right]_t^1=\lim(2-2\sqrt t)\)`,R`Potencia \(-\frac12\).`]], r:R`2`},
  ]},
];

 {n:6, method:'Demostración (regla del producto)', lesson:'l3', bases:['derivadas'],

   [R`Por tanto \(x f(x)\) es una antiderivada de \(f(x)+xf'(x)\): \(\int[f(x)+xf'(x)]\,dx=xf(x)+C\)`, R`Definición de integral indefinida.`],
   [R`Otra forma (partes): \(\int xf'(x)\,dx\) con \(u=x,\ dv=f'(x)dx\Rightarrow v=f(x)\): \(=xf(x)-\int f(x)\,dx\)`, R`Partes.`],
   [R`Sumando: \(\int f\,dx+\left(xf(x)-\int f\,dx\right)=xf(x)\)`, R`Las integrales de \(f\) se cancelan.`],
   [R`Tomando la antiderivada \(xf(x)\) (es decir \(C=0\)) y dividiendo entre \(x\ne0\): \(\dfrac{xf(x)}{x}=f(x)\)`, R`Se pide \(x\ne0\) para poder dividir. La igualdad se entiende eligiendo esa antiderivada; con una \(C\) general queda \(f(x)+\frac Cx\).`]],
  r:R`\frac{\int[f(x)+xf'(x)]\,dx}{x}=\frac{xf(x)}{x}=f(x)\quad\blacksquare`},
];

const QUIZ = [
 {p:R`\int x^2e^{x}\,dx`, a:'Por partes', why:R`Producto polinomio · exponencial; derivar \(x^2\) lo reduce.`},
 {p:R`\int\frac{2x}{x^2+1}\,dx`, a:'Sustitución', why:R`El numerador es la derivada del denominador: \(u=x^2+1\).`},
 {p:R`\int\frac{dx}{x^2-5x+6}`, a:'Fracciones parciales', why:R`Fracción de polinomios con denominador factorizable \((x-2)(x-3)\).`},
 {p:R`\int\sqrt{25-x^2}\,dx`, a:'Sustitución trig.', why:R`Forma \(\sqrt{a^2-x^2}\): \(x=5\sin\theta\).`},
 {p:R`\int\sin^3x\cos^2x\,dx`, a:'Integral trig.', why:R`Potencias de seno y coseno; seno impar.`},
 {p:R`\int_1^\infty\frac{dx}{x^4}`, a:'Impropia', why:R`Límite infinito; integral p con \(p=4>1\): converge a \(\frac13\).`},
];
const QOPTS = ['Sustitución','Por partes','Integral trig.','Sustitución trig.','Fracciones parciales','Impropia'];

/* =====================================================================
   UTILIDADES (clases de Tailwind reutilizadas)
   ===================================================================== */
const C = {
  card:  'my-3.5 rounded-xl border border-stone-200 bg-white p-4 shadow-sm dark:border-zinc-800 dark:bg-zinc-900 dark:shadow-none',
  h3:    'mt-8 mb-2.5 border-t border-stone-200 pt-3 text-xl font-bold dark:border-zinc-800',
  chip:  'inline-block rounded-full border border-transparent bg-blue-50 px-2.5 py-0.5 text-sm text-blue-700 hover:border-blue-500 dark:bg-blue-950/50 dark:text-blue-300',
  btn:   'cursor-pointer rounded-lg border border-stone-200 bg-white px-3 py-1.5 text-sm hover:border-blue-500 disabled:cursor-default disabled:opacity-70 dark:border-zinc-700 dark:bg-zinc-900',
  btnP:  'cursor-pointer rounded-lg border border-blue-600 bg-blue-600 px-3 py-1.5 text-sm text-white hover:bg-blue-700 disabled:cursor-default disabled:opacity-70 dark:border-blue-400 dark:bg-blue-400 dark:text-zinc-950',
  src:   'text-sm italic text-stone-500 dark:text-zinc-400',
  prob:  'overflow-x-auto py-1 text-lg',
  lead:  'mt-0 text-lg text-stone-600 dark:text-zinc-400',
  h2:    'mb-1 text-2xl font-bold leading-tight md:text-3xl',
  note:  '[&_a]:text-blue-700 [&_a]:underline dark:[&_a]:text-blue-300 my-3 rounded-r-xl border-l-4 border-blue-600 bg-blue-50 px-4 py-2.5 dark:border-blue-400 dark:bg-blue-950/40',
  reveal:'mt-2 overflow-x-auto rounded-xl border border-dashed border-stone-300 px-4 py-2.5 dark:border-zinc-700',
};
const TAG = {
  basico: ['Básico', 'bg-emerald-50 text-emerald-700 dark:bg-emerald-950/50 dark:text-emerald-300'],
  medio:  ['Medio',  'bg-amber-50 text-amber-700 dark:bg-amber-950/50 dark:text-amber-300'],
  dificil:['Difícil','bg-rose-50 text-rose-700 dark:bg-rose-950/50 dark:text-rose-300'],
};
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem('calcint:'+k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem('calcint:'+k, JSON.stringify(v)); }catch(e){} }
};
let done = store.get('done') || {};
const baseName = id => (BASES.find(b=>b.id===id)||{}).t || id;

function basesChips(ids){
  return `<div class="my-2.5 flex flex-wrap items-center gap-1.5"><span class="mr-1 text-sm text-stone-500 dark:text-zinc-400">📐 Bases que usa:</span>${ids.map(id=>`<a class="${C.chip}" href="#/bases/${id}">${baseName(id)}</a>`).join('')}</div>`;
}
function stepsBlock(steps, result){
  return `<div data-steps>
   <div class="my-2.5 space-y-2">${steps.map((s,i)=>`
     <div data-step class="hidden [&_a]:text-blue-700 [&_a]:underline dark:[&_a]:text-blue-300 relative overflow-x-auto rounded-xl border border-stone-200 bg-stone-50 py-2.5 pl-12 pr-3 dark:border-zinc-800 dark:bg-zinc-950">
       <span class="absolute left-3 top-2.5 flex h-6 w-6 items-center justify-center rounded-full bg-blue-600 text-xs font-bold text-white dark:bg-blue-400 dark:text-zinc-950">${i+1}</span>
       <div><b class="text-xs uppercase tracking-wide text-blue-700 dark:text-blue-300">Qué hacemos</b><br>${s[0]}</div>
       <div class="why mt-1 text-[0.95rem] text-stone-600 dark:text-zinc-400"><b class="text-xs uppercase tracking-wide text-amber-700 dark:text-amber-300">Por qué</b> ${s[1]}</div>
     </div>`).join('')}</div>
   <div data-result class="hidden mt-2 overflow-x-auto rounded-xl border border-emerald-600 bg-emerald-50 px-4 py-2.5 dark:border-emerald-500 dark:bg-emerald-950/40">✅ <b>Resultado:</b> \\(\\displaystyle ${result}\\)</div>
   <div class="mt-2 flex flex-wrap gap-2">
     <button class="${C.btnP}" data-act="next">Ver paso 1 ▸</button>
     <button class="${C.btn}" data-act="all">Mostrar todo</button>
     <button class="${C.btn}" data-act="reset">Reiniciar</button>
   </div></div>`;
}
function exampleCard(ex){
  const [name, cls] = TAG[ex.lvl];
  return `<div class="${C.card}">
   <div><span class="mr-1.5 rounded-md px-2 py-0.5 align-middle text-xs font-bold uppercase tracking-wide ${cls}">${name}</span><span class="${C.src}">${ex.src}</span></div>
   <div class="${C.prob}">\\[${ex.p}\\]</div>
   ${stepsBlock(ex.steps, ex.r)}</div>`;
}
function exerciseCard(ex, key, i){
  return `<div class="${C.card}" data-card>
   <div class="flex flex-wrap items-center gap-2"><b>Ejercicio ${i+1}</b><span class="${C.src}">${ex.src}</span>
     <label class="ml-auto inline-flex cursor-pointer items-center gap-1.5 text-sm text-stone-500 dark:text-zinc-400"><input type="checkbox" class="accent-emerald-600" data-key="${key}" ${done[key]?'checked':''}> Lo resolví</label></div>
   <div class="${C.prob}">\\[${ex.p}\\]</div>
   <div class="mt-2 flex flex-wrap gap-2">
    <button class="${C.btn}" data-toggle="hint">💡 Pista</button>
    <button class="${C.btn}" data-toggle="ans">🎯 Ver respuesta</button>
    <button class="${C.btn}" data-toggle="sol">🪜 Solución paso a paso</button>
   </div>
   <div class="hidden ${C.reveal}" data-part="hint">${ex.hint}</div>
   <div class="hidden ${C.reveal}" data-part="ans">\\(\\displaystyle ${ex.r}\\)</div>
   <div class="hidden" data-part="sol">${stepsBlock(ex.steps, ex.r)}</div></div>`;
}
function lessonProgress(L){
  const tot = L.exercises.length;
  const n = L.exercises.filter((_,i)=>done[L.id+'-'+i]).length;
  return {n, tot};
}
const tile = (href, title, sub) =>
  `<a href="${href}" class="block rounded-xl border border-stone-200 bg-white p-4 shadow-sm hover:border-blue-500 dark:border-zinc-800 dark:bg-zinc-900"><b class="mb-1 block">${title}</b><small class="text-stone-500 dark:text-zinc-400">${sub}</small></a>`;

/* =====================================================================
   PÁGINAS
   ===================================================================== */
function pageInicio(){
  const all = LESSONS.reduce((a,L)=>a+L.exercises.length,0);
  const ok = LESSONS.reduce((a,L)=>a+lessonProgress(L).n,0);
  return `
  <h2 class="${C.h2}">Aprende Cálculo Integral paso a paso</h2>
  <p class="${C.lead}">Una guía interactiva: cada tema empieza por lo más básico, luego ejemplos de nivel medio y difícil resueltos paso a paso (qué se hace y por qué), y termina con ejercicios para ti.</p>
  <div class="${C.card}"><b>Tu progreso:</b> ${ok} de ${all} ejercicios marcados como resueltos
   <div class="my-1.5 h-2 overflow-hidden rounded-full bg-stone-200 dark:bg-zinc-800"><div class="h-full bg-emerald-500 transition-all" style="width:${all?100*ok/all:0}%"></div></div>
   <small class="${C.src}">Se guarda solo en este navegador.</small></div>

  <h3 class="${C.h3}">¿Cómo usar esta guía?</h3>
  <ol>
   <li>Si una sección menciona algo que no recuerdas, pulsa el botón azul de <b>Bases que usa</b>: te lleva a la <a href="#/bases">página de bases matemáticas</a>.</li>
   <li>En los ejemplos, intenta el problema primero y luego revela <b>un paso a la vez</b> con "Ver paso".</li>
   <li>En los ejercicios usa la pista solo si te atascas; luego compara con la respuesta.</li>
   <li>Al final, practica con la <a href="#/examen">solución del examen</a> y el <a href="#/estrategia">entrenador de estrategia</a>.</li>
  </ol>

  <h3 class="${C.h3}">Ruta de aprendizaje</h3>
  <div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
   ${tile('#/bases','0 · Bases matemáticas','Potencias, factorización, logaritmos, trigonometría, derivadas…')}
   ${LESSONS.map(L=>{const p=lessonProgress(L);return tile('#/'+L.id, `${L.n} · ${L.t}`, `${L.examples.length} ejemplos · ${p.n}/${p.tot} ejercicios`)}).join('')}
   ${tile('#/estrategia','8 · ¿Qué técnica uso?','Tabla de decisión y mini-quiz')}
   ${tile('#/examen','9 · Solución del examen','Los 6 ejercicios de la foto, paso a paso')}
  </div>

  <h3 class="${C.h3}">Fuentes</h3>
  <p>Los ejemplos marcados con <i>Stewart</i> provienen de los ejemplos resueltos de James Stewart, <i>Cálculo de una variable: Trascendentes tempranas</i> (7.ª/8.ª ed., Cengage Learning), secciones 5.4, 5.5, 7.1–7.4 y 7.8, y tienen el mismo resultado que el libro. La numeración de ejemplos puede variar ligeramente entre ediciones. Los ejercicios de práctica son del mismo tipo que los de esas secciones; todas las respuestas se verificaron derivando el resultado.</p>`;
}

function pageBases(){
  return `<h2 class="${C.h2}">Bases matemáticas</h2>
  <p class="${C.lead}">Lo mínimo que necesitas dominar antes de integrar. Cada lección enlaza aquí directamente al tema que usa.</p>
  <div class="${C.card} flex flex-wrap gap-1.5"><b class="mr-1">Índice:</b> ${BASES.map(b=>`<a class="${C.chip}" href="#/bases/${b.id}">${b.t}</a>`).join(' ')}</div>
  ${BASES.map(b=>`<section id="b-${b.id}" class="scroll-mt-16"><h3 class="${C.h3}">${b.t}</h3>${b.html}
   <p class="${C.src}">Se usa en: ${LESSONS.filter(L=>L.bases.includes(b.id)).map(L=>`<a href="#/${L.id}">${L.short}</a>`).join(', ') || '—'}${EXAM.some(e=>e.bases.includes(b.id))?', <a href="#/examen">Examen</a>':''}</p></section>`).join('')}`;
}

function pageLesson(L){
  const i = LESSONS.indexOf(L), prev = LESSONS[i-1], next = LESSONS[i+1];
  const p = lessonProgress(L);
  const link = (href, txt) => `<a class="${C.btn}" href="${href}">${txt}</a>`;
  return `<h2 class="${C.h2}">${L.n}. ${L.t}</h2>
  ${basesChips(L.bases)}
  <h3 class="${C.h3}">Lo más básico</h3>${L.intro}
  <h3 class="${C.h3}">Ejemplos resueltos</h3>
  <p class="${C.src}">Intenta cada uno antes de revelar los pasos.</p>
  ${L.examples.map(exampleCard).join('')}
  <h3 class="${C.h3}">Ejercicios para ti <small class="${C.src}">(${p.n}/${p.tot} resueltos)</small></h3>
  ${L.exercises.map((ex,k)=>exerciseCard(ex, L.id+'-'+k, k)).join('')}
  <div class="mt-10 flex flex-wrap justify-between gap-2.5">
   ${prev ? link('#/'+prev.id, '◂ '+prev.short) : link('#/bases','◂ Bases')}
   ${next ? link('#/'+next.id, next.short+' ▸') : link('#/estrategia','¿Qué técnica uso? ▸')}
  </div>`;
}

function pageEstrategia(){
  return `<h2 class="${C.h2}">¿Qué técnica uso?</h2>
  <p class="${C.lead}">Antes de integrar, <b>mira la forma</b> del integrando. Esta tabla resume las pistas.</p>
  <div class="overflow-x-auto"><table>
   <tr><th>Si ves…</th><th>Prueba</th><th>Lección</th></tr>
   <tr><td>Algo que se simplifica a potencias / está en la tabla</td><td>Integral directa</td><td><a href="#/l1">1</a></td></tr>
   <tr><td>Una función "de adentro" cuya derivada aparece afuera</td><td>Sustitución</td><td><a href="#/l2">2</a></td></tr>
   <tr><td>Producto de tipos distintos (poli·exp, poli·trig, \\(\\ln\\), \\(\\arctan\\))</td><td>Por partes (LIATE)</td><td><a href="#/l3">3</a></td></tr>
   <tr><td>Potencias de \\(\\sin,\\cos,\\tan,\\sec\\)</td><td>Identidades + sustitución</td><td><a href="#/l4">4</a></td></tr>
   <tr><td>\\(\\sqrt{a^2-x^2},\\ \\sqrt{a^2+x^2},\\ \\sqrt{x^2-a^2}\\)</td><td>Sustitución trigonométrica</td><td><a href="#/l5">5</a></td></tr>
   <tr><td>Cociente de polinomios</td><td>Fracciones parciales (dividir si es impropia)</td><td><a href="#/l6">6</a></td></tr>
   <tr><td>Límite \\(\\pm\\infty\\) o el integrando explota</td><td>Impropia (límite)</td><td><a href="#/l7">7</a></td></tr>
  </table></div>
  <h3 class="${C.h3}">Mini-quiz: elige la técnica</h3>
  ${QUIZ.map((q,i)=>`<div class="${C.card}" data-q="${i}"><div class="${C.prob}">\\[${q.p}\\]</div>
    <div class="mt-2 flex flex-wrap gap-2">${QOPTS.map(o=>`<button class="${C.btn}" data-opt="${o}">${o}</button>`).join('')}</div>
    <div data-fb class="mt-2 text-[0.95rem]"></div></div>`).join('')}`;
}

function pageExamen(){
  return `<h2 class="${C.h2}">Solución del examen: Técnicas de integración</h2>
  <p class="${C.lead}">Enunciado: <i>"Evalúe las siguientes integrales utilizando el método que mejor crea conveniente, de entre aquellos tratados en clase."</i> Nota: hacer 5 de los 6 ejercicios.</p>
  <div class="${C.card}"><b>Resumen</b>
   <div class="mt-2 overflow-x-auto"><table><tr><th>#</th><th>Integral</th><th>Método</th><th>Resultado</th></tr>
   ${EXAM.map(e=>`<tr><td><a href="#/examen/${e.n}">${e.n}</a></td><td>\\(${e.n===6?R`f(x)=\frac{\int[f+xf']dx}{x}`:e.p}\\)</td><td>${e.method}</td><td>\\(${e.n===6?R`\text{demostrado}`:e.r}\\)</td></tr>`).join('')}
   </table></div></div>
  <div class="${C.note}"><b>Consejo para el examen:</b> si debes escoger 5 de 6, los más mecánicos son el 1, 3 y 4; el 2 exige manejar el límite; el 5 requiere el triángulo; el 6 es corto si reconoces la regla del producto.</div>
  ${EXAM.map(e=>`<section id="b-${e.n}" class="${C.card} scroll-mt-16">
   <h4 class="text-lg font-bold">Ejercicio ${e.n} · <span class="text-sm font-normal text-stone-500 dark:text-zinc-400">${e.method}</span></h4>
   <div class="${C.prob}">\\[${e.p}\\]</div>
   ${basesChips(e.bases)}
   <div class="my-2.5 flex flex-wrap items-center gap-1.5"><span class="mr-1 text-sm text-stone-500 dark:text-zinc-400">📘 Lección:</span><a class="${C.chip}" href="#/${e.lesson}">${LESSONS.find(L=>L.id===e.lesson).t}</a></div>
   <div class="${C.note}"><b>¿Cómo reconocer el método?</b> ${e.idea}</div>
   ${stepsBlock(e.steps, e.r)}</section>`).join('')}`;
}

/* =====================================================================
   NAVEGACIÓN / ROUTER (hash: #/pagina/subseccion)
   ===================================================================== */
function buildNav(current){
  const grp = t => `<div class="mx-2 mb-1.5 mt-3.5 text-xs uppercase tracking-wider text-stone-500 dark:text-zinc-400">${t}</div>`;
  const a = (href,label,id,extra='') => `<a href="${href}" class="flex justify-between gap-1.5 rounded-lg px-2.5 py-1.5 text-[0.93rem] hover:bg-blue-50 dark:hover:bg-blue-950/50 ${current===id?'bg-blue-50 font-semibold text-blue-700 dark:bg-blue-950/50 dark:text-blue-300':''}">${label}${extra}</a>`;
  document.getElementById('side').innerHTML =
    grp('Guía') + a('#/inicio','🏠 Inicio','inicio') + a('#/bases','📐 Bases matemáticas','bases') +
    grp('Técnicas') + LESSONS.map(L=>{const p=lessonProgress(L);return a('#/'+L.id, `${L.n}. ${L.short}`, L.id, `<span class="text-xs font-normal text-stone-500 dark:text-zinc-400">${p.n}/${p.tot}</span>`)}).join('') +
    grp('Práctica') + a('#/estrategia','🧭 ¿Qué técnica uso?','estrategia') + a('#/examen','📝 Solución del examen','examen');
}
function renderMath(el){
  if (window.renderMathInElement){
    renderMathInElement(el,{delimiters:[{left:'\\[',right:'\\]',display:true},{left:'\\(',right:'\\)',display:false}],throwOnError:false});
  }
}
const side = document.getElementById('side');
function toggleMenu(open){ side.classList.toggle('-translate-x-full', !open); }
function route(){
  const [r='inicio', sub] = location.hash.replace(/^#\/?/,'').split('/').map(s=>s||undefined);
  const view = document.getElementById('view');
  const L = LESSONS.find(x=>x.id===r);
  const pages = {bases:pageBases, examen:pageExamen, estrategia:pageEstrategia};
  const id = L ? r : (pages[r] ? r : 'inicio');
  view.innerHTML = L ? pageLesson(L) : (pages[r] ? pages[r]() : pageInicio());
  buildNav(id);
  renderMath(view);
  toggleMenu(false);
  const target = sub && document.getElementById('b-'+sub);
  if (target) setTimeout(()=>target.scrollIntoView({behavior:'smooth',block:'start'}),30);
  else window.scrollTo(0,0);
  const titles = {inicio:'Inicio',bases:'Bases matemáticas',examen:'Solución del examen',estrategia:'¿Qué técnica uso?'};
  document.title = (L?L.short:titles[id]) + ' · Cálculo Integral';
}

/* ---------- Interacción ---------- */
const RIGHT = ['border-emerald-600','bg-emerald-50','text-emerald-700','dark:bg-emerald-950/50','dark:text-emerald-300'];
const WRONG = ['border-rose-600','bg-rose-50','text-rose-700','dark:bg-rose-950/50','dark:text-rose-300'];
document.addEventListener('click', e=>{
  const showLink = e.target.closest('[data-show]');
  if (showLink){
    e.preventDefault();
    const card = showLink.closest('[data-q]'), q = QUIZ[+card.dataset.q], fb = card.querySelector('[data-fb]');
    fb.innerHTML = `👉 <b>${q.a}</b>: ${q.why}`; renderMath(fb);
    return;
  }
  const btn = e.target.closest('button');
  if (!btn) return;

  // Pasos: siguiente / todos / reiniciar
  if (btn.dataset.act){
    const box = btn.closest('[data-steps]');
    const steps = [...box.querySelectorAll('[data-step]')], res = box.querySelector('[data-result]');
    const nextBtn = box.querySelector('[data-act="next"]');
    let shown = steps.filter(s=>!s.classList.contains('hidden')).length;
    if (btn.dataset.act==='next'){ if (shown<steps.length) steps[shown++].classList.remove('hidden'); else res.classList.remove('hidden'); }
    if (btn.dataset.act==='all'){ steps.forEach(s=>s.classList.remove('hidden')); res.classList.remove('hidden'); shown=steps.length; }
    if (btn.dataset.act==='reset'){ steps.forEach(s=>s.classList.add('hidden')); res.classList.add('hidden'); shown=0; }
    const fin = !res.classList.contains('hidden');
    nextBtn.textContent = shown<steps.length ? `Ver paso ${shown+1} ▸` : (fin ? 'Completo ✓' : 'Ver resultado ▸');
    nextBtn.disabled = fin;
    return;
  }
  // Ejercicios: pista / respuesta / solución
  if (btn.dataset.toggle){
    btn.closest('[data-card]').querySelector(`[data-part="${btn.dataset.toggle}"]`).classList.toggle('hidden');
    return;
  }
  // Quiz
  if (btn.dataset.opt){
    const card = btn.closest('[data-q]'), q = QUIZ[+card.dataset.q], fb = card.querySelector('[data-fb]');
    card.querySelectorAll('[data-opt]').forEach(b=>b.classList.remove(...RIGHT, ...WRONG));
    const ok = btn.dataset.opt===q.a;
    btn.classList.add(...(ok?RIGHT:WRONG));
    fb.innerHTML = ok ? `✅ ¡Correcto! ${q.why}` : `❌ No es la mejor opción. Pista: piensa en la forma del integrando. <a href="#" data-show class="text-blue-700 underline dark:text-blue-300">Ver respuesta</a>`;
    renderMath(fb);
  }
});
document.addEventListener('change', e=>{
  const k = e.target.dataset && e.target.dataset.key;
  if (!k) return;
  if (e.target.checked) done[k]=true; else delete done[k];
  store.set('done', done);
  buildNav(location.hash.replace(/^#\/?/,'').split('/')[0] || 'inicio');
});
document.getElementById('menuBtn').onclick = ()=>toggleMenu(side.classList.contains('-translate-x-full'));
document.getElementById('themeBtn').onclick = ()=>{
  const dark = document.documentElement.classList.toggle('dark');
  store.set('theme', dark ? 'dark' : 'light');
};
window.addEventListener('hashchange', route);
window.addEventListener('load', route);
</script>
</body>
</html>
