<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#18181b" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Integrando</title>
<meta name="description" content="Guía interactiva paso a paso: fundamentos, cálculo diferencial y cálculo integral, con ejercicios para armar con piezas y diccionario de propiedades.">
<!-- Todo va incluido en este archivo (funciona sin internet):
     · Estilos: Tailwind CSS v4.1.4, compilado a partir de las clases usadas en este HTML.
     · Fórmulas: KaTeX v0.16.9 (con sus fuentes).
     · Lógica: JavaScript puro (al final del archivo). -->
<!--@@VENDOR@@-->
<style>
  /* Animaciones del juego (catálogo): cambio antes → después y flotación */
  @keyframes demo-arrastre{0%,12%{transform:translate(0,0);opacity:0}18%{opacity:1;transform:translate(0,0)}55%{transform:translate(4.2rem,-6.4rem);opacity:1}62%,100%{transform:translate(4.2rem,-6.4rem);opacity:0}}
  @keyframes demo-aparece{0%,58%{opacity:0;transform:scale(.6)}66%{opacity:1;transform:scale(1.1)}72%,92%{opacity:1;transform:scale(1)}100%{opacity:0}}
  @keyframes demo-caret{0%,25%{opacity:0}30%,58%{opacity:1}62%,100%{opacity:0}}
  [data-pick],[data-pick] *,[data-dig]{touch-action:none !important}
  .lego-scroll{overflow-x:scroll !important;padding-bottom:10px;scrollbar-width:auto;scrollbar-color:#3b82f6 #e7e5e4}
  .lego-scroll::-webkit-scrollbar{height:10px;display:block}
  .lego-scroll::-webkit-scrollbar-track{background:#e7e5e4;border-radius:9999px}
  .lego-scroll::-webkit-scrollbar-thumb{background:#3b82f6;border-radius:9999px}
  .dark .lego-scroll{scrollbar-color:#60a5fa #27272a}
  .dark .lego-scroll::-webkit-scrollbar-track{background:#27272a}
  #juego.juego-menu{top:var(--alto-cab,57px);bottom:calc(3.85rem + env(safe-area-inset-bottom));z-index:25}
  body.modo-landing #bottomNav, body.modo-landing #menuBtn, body.modo-landing #selectorModo, body.modo-juego #menuBtn{display:none}
  body:not(.modo-aprender) #side{display:none}
  @keyframes escena-0{0%,30%{opacity:1}34%,97%{opacity:0}100%{opacity:1}}
  @keyframes escena-1{0%,30%{opacity:0}34%,63%{opacity:1}67%,100%{opacity:0}}
  @keyframes escena-2{0%,63%{opacity:0}67%,96%{opacity:1}100%{opacity:0}}
  @keyframes orbe-a{0%{transform:rotate(0deg) translateX(30px)}70%{transform:rotate(540deg) translateX(4px);opacity:1}75%,100%{transform:rotate(560deg) translateX(0);opacity:0}}
  @keyframes orbe-b{0%{transform:rotate(180deg) translateX(30px)}70%{transform:rotate(720deg) translateX(4px);opacity:1}75%,100%{transform:rotate(740deg) translateX(0);opacity:0}}
  @keyframes destello{0%,70%{transform:scale(0);opacity:0}76%{transform:scale(1.4);opacity:1}100%{transform:scale(2.2);opacity:0}}
  @keyframes fusion-pop{0%,70%{transform:scale(.55);opacity:.35}80%{transform:scale(1.25);opacity:1}90%,100%{transform:scale(1);opacity:1}}
  @keyframes cat-a{0%,42%{opacity:1}50%,92%{opacity:0}100%{opacity:1}}
  @keyframes cat-b{0%,42%{opacity:0}50%,92%{opacity:1}100%{opacity:0}}
  @keyframes sena{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
  @keyframes vibrar{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
  .lego-sena{animation:sena .5s ease-in-out infinite;box-shadow:0 0 0 3px #f59e0b,0 0 12px #f59e0b}
  .demo-vibrar{animation:vibrar .45s ease-in-out infinite;box-shadow:0 0 0 2px #f43f5e}
  .demo-arrastre{opacity:.35;outline:2px dashed #3b82f6}
  .lego-vibrar{animation:vibrar .35s ease-in-out 2;box-shadow:0 0 0 2px #f43f5e}
  @keyframes flotar{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
</style>
<script>
  // Tema claro/oscuro antes de pintar (evita parpadeo)
  (function(){
    let t = null; try { t = JSON.parse(localStorage.getItem('calcint:theme')); } catch(e){}
    const dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.classList.toggle('dark', dark);
  })();
</script>
</head>
<body class="bg-stone-50 text-stone-900 antialiased [-webkit-tap-highlight-color:transparent] dark:bg-zinc-950 dark:text-zinc-100 font-sans leading-relaxed">
<header id="cabecera" class="sticky top-0 z-30 flex items-center gap-2 border-b border-stone-200 bg-white/95 px-3 pb-2 pt-[max(0.5rem,env(safe-area-inset-top))] sm:px-4 backdrop-blur dark:border-zinc-800 dark:bg-zinc-900/95">
  <button id="menuBtn" class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl border border-stone-200 text-lg touch-manipulation dark:border-zinc-700" aria-label="Temas de la sección">☰</button>
  <a href="#/" class="flex shrink-0 items-center gap-1.5 font-black" aria-label="Inicio"><span class="flex h-9 w-9 items-center justify-center rounded-xl bg-gradient-to-br from-blue-600 to-violet-600 text-lg text-white shadow">∫</span><span class="hidden sm:inline">Integrando</span></a>
  <div id="selectorModo" class="ml-auto flex rounded-full border border-stone-200 bg-stone-100 p-1 text-sm font-semibold dark:border-zinc-700 dark:bg-zinc-800" role="tablist" aria-label="Modo">
    <a href="#/jugar" data-modo-app="juego" class="rounded-full px-3.5 py-1.5 touch-manipulation">🎮 Jugar</a>
    <a href="#/aprender" data-modo-app="aprender" class="rounded-full px-3.5 py-1.5 touch-manipulation">📚 Aprender</a>
  </div>
  <button data-ajustes class="ml-auto flex h-10 w-10 shrink-0 items-center justify-center rounded-xl border border-stone-200 text-lg touch-manipulation hover:border-blue-500 dark:border-zinc-700" aria-label="Configuración" title="Configuración">⚙️</button>
</header>
<div class="mx-auto flex max-w-6xl">
  <nav id="side" class="fixed left-0 top-0 z-40 h-dvh w-[82vw] max-w-72 pt-[max(1rem,env(safe-area-inset-top))] pb-[calc(1rem+env(safe-area-inset-bottom))] md:top-[57px] md:z-20 md:h-[calc(100dvh-57px)] md:w-64 md:pt-4 shrink-0 -translate-x-full overflow-y-auto border-r border-stone-200 bg-white px-3 py-4 shadow-2xl transition-transform md:sticky md:translate-x-0 md:bg-transparent md:shadow-none dark:border-zinc-800 dark:bg-zinc-900 md:dark:bg-transparent"></nav>
  <main id="view" class="min-w-0 flex-1 px-3.5 pb-[calc(6rem+env(safe-area-inset-bottom))] pt-4 sm:px-5 md:px-7 md:pb-20
    [&_p]:my-2.5 [&_ul]:my-2 [&_ul]:list-disc [&_ul]:pl-6 [&_ol]:my-2 [&_ol]:list-decimal [&_ol]:pl-6 [&_li]:my-1
    [&_p_a]:text-blue-700 [&_p_a]:underline [&_li_a]:text-blue-700 [&_li_a]:underline [&_td_a]:text-blue-700 [&_td_a]:underline [&_.why_a]:text-blue-700 [&_.why_a]:underline
    dark:[&_p_a]:text-blue-300 dark:[&_li_a]:text-blue-300 dark:[&_td_a]:text-blue-300 dark:[&_.why_a]:text-blue-300
    [&_table]:w-full [&_table]:border-collapse [&_table]:text-[0.95rem]
    [&_th]:border [&_th]:border-stone-200 [&_th]:bg-stone-100 [&_th]:px-2.5 [&_th]:py-2 [&_th]:text-left
    [&_td]:border [&_td]:border-stone-200 [&_td]:px-2.5 [&_td]:py-2 [&_td]:align-top
    dark:[&_th]:border-zinc-700 dark:[&_th]:bg-zinc-800 dark:[&_td]:border-zinc-700
    [&_.katex-display]:overflow-x-auto [&_.katex-display]:overflow-y-hidden [&_.katex-display]:py-0.5"></main>
</div>
<div id="scrim" class="fixed inset-0 z-[35] hidden bg-black/40 md:hidden"></div>

<!-- Juego (pantalla completa) -->
<div id="juego" class="fixed inset-0 z-[45] hidden bg-zinc-950 text-zinc-100"></div>
<div id="juegoPiezas" class="fixed inset-0 z-[46] hidden bg-black/40"></div>

<!-- Barra de navegación inferior (celular) -->
<nav id="bottomNav" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-200 bg-white/95 pb-[env(safe-area-inset-bottom)] backdrop-blur dark:border-zinc-800 dark:bg-zinc-900/95" aria-label="Menú">
  <div data-navset="aprender" class="mx-auto flex max-w-xl">
    <a href="#/aprender" data-bn="home" class="flex flex-1 flex-col items-center gap-0.5 pt-1.5 pb-1 text-[11px] text-stone-500 touch-manipulation dark:text-zinc-400"><span class="flex h-7 w-12 items-center justify-center rounded-full text-lg">🏠</span>Inicio</a>
    <a href="#/ruta" data-bn="ruta" class="flex flex-1 flex-col items-center gap-0.5 pt-1.5 pb-1 text-[11px] text-stone-500 touch-manipulation dark:text-zinc-400"><span class="flex h-7 w-12 items-center justify-center rounded-full text-lg">🗺️</span>Ruta</a>
    <button data-dict-open data-bn="dict" class="flex flex-1 flex-col items-center gap-0.5 pt-1.5 pb-1 text-[11px] text-stone-500 touch-manipulation dark:text-zinc-400"><span class="flex h-7 w-12 items-center justify-center rounded-full text-lg">📖</span>Diccionario</button>
    <button data-ajustes data-bn="ajustes" class="flex flex-1 flex-col items-center gap-0.5 pt-1.5 pb-1 text-[11px] text-stone-500 touch-manipulation dark:text-zinc-400"><span class="flex h-7 w-12 items-center justify-center rounded-full text-lg">⚙️</span>Ajustes</button>
  </div>
  <div data-navset="juego" class="mx-auto flex hidden max-w-xl">
    <a href="#/jugar" data-bn="j-inicio" class="flex flex-1 flex-col items-center gap-0.5 pt-1.5 pb-1 text-[11px] text-stone-500 touch-manipulation dark:text-zinc-400"><span class="flex h-7 w-12 items-center justify-center rounded-full text-lg">🎮</span>Partidas</a>
    <a href="#/jugar/catalogo" data-bn="j-catalogo" class="flex flex-1 flex-col items-center gap-0.5 pt-1.5 pb-1 text-[11px] text-stone-500 touch-manipulation dark:text-zinc-400"><span class="flex h-7 w-12 items-center justify-center rounded-full text-lg">📚</span>Catálogo</a>
    <a href="#/jugar/mazo" data-bn="j-mazo" class="flex flex-1 flex-col items-center gap-0.5 pt-1.5 pb-1 text-[11px] text-stone-500 touch-manipulation dark:text-zinc-400"><span class="flex h-7 w-12 items-center justify-center rounded-full text-lg">🃏</span>Mazo</a>
    <a href="#/jugar/peloton" data-bn="j-peloton" class="flex flex-1 flex-col items-center gap-0.5 pt-1.5 pb-1 text-[11px] text-stone-500 touch-manipulation dark:text-zinc-400"><span class="flex h-7 w-12 items-center justify-center rounded-full text-lg">🪖</span>Pelotón</a>
    <a href="#/jugar/mejoras" data-bn="j-mejoras" class="flex flex-1 flex-col items-center gap-0.5 pt-1.5 pb-1 text-[11px] text-stone-500 touch-manipulation dark:text-zinc-400"><span class="flex h-7 w-12 items-center justify-center rounded-full text-lg">🛠</span>Mejoras</a>
  </div>
</nav>

<!-- Modal: Diccionario de propiedades -->
<!-- Modal: Configuración (igual en la portada, en Aprender y en Jugar) -->
<div id="ajustes" class="fixed inset-0 z-[70] hidden items-end justify-center bg-black/50 sm:items-center sm:p-4" role="dialog" aria-modal="true" aria-label="Configuración">
  <div id="ajustesCuerpo" class="max-h-[90dvh] w-full max-w-lg overflow-y-auto rounded-t-3xl bg-white p-4 pb-[calc(1rem+env(safe-area-inset-bottom))] shadow-2xl sm:rounded-3xl dark:bg-zinc-900"></div>
</div>
<div id="dict" class="fixed inset-0 z-50 hidden items-stretch justify-center bg-black/50 p-0 sm:items-center sm:p-4" role="dialog" aria-modal="true" aria-labelledby="dictTitle">
  <div class="flex h-dvh w-full max-w-4xl flex-col overflow-hidden bg-white shadow-2xl sm:h-[85vh] sm:rounded-2xl dark:bg-zinc-900">
    <div class="border-b border-stone-200 px-3.5 pb-3 pt-[max(0.75rem,env(safe-area-inset-top))] sm:p-4 dark:border-zinc-800">
      <div class="flex items-center gap-2">
        <h2 id="dictTitle" class="flex-1 text-lg font-bold">📖 Diccionario de propiedades</h2>
        <span id="dictCount" class="text-sm text-stone-500 dark:text-zinc-400"></span>
        <button data-dict-close class="flex h-10 w-10 items-center justify-center rounded-xl border border-stone-200 text-base touch-manipulation hover:border-blue-500 dark:border-zinc-700" aria-label="Cerrar">✕</button>
      </div>
      <input id="dictQ" type="search" placeholder="Buscar: potencia, logaritmo, cadena, fracción…" class="mt-3 w-full rounded-xl border border-stone-300 bg-white px-3.5 py-2.5 text-base outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 dark:border-zinc-700 dark:bg-zinc-950 dark:focus:ring-blue-900">
      <div id="dictTabs" class="-mx-3.5 mt-3 flex gap-2 overflow-x-auto px-3.5 pb-1 [scrollbar-width:none] sm:mx-0 sm:flex-wrap sm:px-0"></div>
    </div>
    <div id="dictList" class="flex-1 overflow-y-auto overscroll-contain px-3.5 pb-[calc(1.5rem+env(safe-area-inset-bottom))] sm:px-4"></div>
  </div>
</div>
